<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Record Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"
  />

  <?!= include('style'); ?>
</head>
<body>
  <div class="page">
    <div class="container">

      <header class="app-header">
        <div class="logo-avatar">
          <span class="material-symbols-rounded" aria-hidden="true">school</span>
        </div>
        <h1>Student Record Portal</h1>
        <p class="subtitle">Enter your Board Roll and Mobile Number to view your record</p>
      </header>

      <form id="searchForm" class="search-card" autocomplete="off">
        <div class="text-field">
          <input
            type="text"
            id="boardRoll"
            name="boardRoll"
            placeholder=" "
            inputmode="numeric"
            required
          />
          <label for="boardRoll">Board Roll</label>
        </div>

        <div class="text-field">
          <input
            type="text"
            id="mobile"
            name="mobile"
            placeholder=" "
            inputmode="tel"
            required
          />
          <label for="mobile">Mobile Number</label>
        </div>

        <button type="submit" id="searchBtn" class="btn-filled">
          <span class="material-symbols-rounded" aria-hidden="true">search</span>
          <span class="btn-text">Search Record</span>
        </button>

        <p id="formError" class="form-error" hidden></p>
      </form>

      <div id="statusBox" class="status-box" hidden>
        <div class="spinner" role="status" aria-label="Loading"></div>
        <p>Fetching your record…</p>
      </div>

      <div id="messageBox" class="message-box" hidden></div>

      <div id="resultCard" class="result-card" hidden></div>

    </div>

    <footer class="app-footer">
      <p>&copy; <span id="year"></span> Student Record Portal</p>
    </footer>
  </div>

  <?!= include('script'); ?>
</body>
</html>
